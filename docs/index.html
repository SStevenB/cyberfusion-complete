<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CyberFusion — Threat Intelligence Platform (Demo)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="CyberFusion — an explainable, lab-safe cyber threat intelligence fusion and prioritization platform. Static portfolio demo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
<style>
/* CyberFusion — refined enterprise UI */
:root {
  --navy-900: #0a1226;
  --navy-800: #0e1830;
  --navy-700: #16223f;
  --navy-600: #243456;
  --navy-500: #3a4a73;
  --sidebar-text: #c5cbdb;
  --sidebar-text-dim: #8a93ab;
  --sidebar-border: #1c2748;

  --bg: #f6f7fb;
  --surface: #ffffff;
  --surface-2: #fafbfd;
  --border: #e5e8ef;
  --border-strong: #d2d7e2;

  --text-1: #0f172a;
  --text-2: #475569;
  --text-3: #64748b;
  --text-4: #94a3b8;

  --accent: #0fb5a8;
  --accent-dark: #0a8f85;
  --accent-soft: #e6f7f5;

  --crit: #dc2626;
  --crit-soft: #fdecec;
  --high: #ea580c;
  --high-soft: #fdeee2;
  --med: #2563eb;
  --med-soft: #e6efff;
  --low: #16a34a;
  --low-soft: #e6f6ec;
  --unknown: #64748b;
  --unknown-soft: #eef0f4;

  --kev: #7b2fbe;
  --kev-soft: #f1e8fa;

  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 10px 30px -10px rgba(15, 23, 42, 0.18);

  --radius: 8px;
  --radius-sm: 6px;
  --radius-lg: 12px;

  --sidebar-w: 248px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Manrope', system-ui, -apple-system, sans-serif;
  font-size: 14px;
  color: var(--text-1);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
code, .mono { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; }

/* ── Layout ────────────────────────────────────────────────────────── */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  min-height: 100vh;
}

/* ── Sidebar ───────────────────────────────────────────────────────── */
.sidebar {
  background: var(--navy-800);
  color: var(--sidebar-text);
  border-right: 1px solid var(--navy-900);
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 20px 0 12px;
}
.sb-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 20px 18px;
  border-bottom: 1px solid var(--sidebar-border);
}
.sb-mark {
  width: 28px; height: 28px;
  border-radius: 7px;
  background: linear-gradient(135deg, var(--accent) 0%, #1ed3c2 100%);
  display: grid; place-items: center;
  color: var(--navy-900);
  font-weight: 800;
  font-size: 14px;
  letter-spacing: -0.02em;
}
.sb-name { font-weight: 700; color: #fff; font-size: 15px; letter-spacing: -0.01em; }
.sb-sub { font-size: 11px; color: var(--sidebar-text-dim); margin-top: 1px; }

.sb-org {
  padding: 14px 20px 12px;
  border-bottom: 1px solid var(--sidebar-border);
}
.sb-org-label { font-size: 10px; letter-spacing: 0.08em; color: var(--sidebar-text-dim); text-transform: uppercase; }
.sb-org-name { font-weight: 600; color: #fff; margin-top: 2px; font-size: 13px; }
.sb-org-scope { font-size: 11px; color: var(--sidebar-text-dim); margin-top: 2px; font-family: 'IBM Plex Mono', monospace; }

.sb-section { padding: 16px 12px 6px; }
.sb-section-label {
  padding: 0 8px 8px;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--sidebar-text-dim);
  font-weight: 600;
}
.sb-nav { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 1px; }
.sb-nav-item {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 8px 10px;
  border-radius: 6px;
  cursor: pointer;
  color: var(--sidebar-text);
  font-size: 13px;
  font-weight: 500;
  user-select: none;
  transition: background .12s, color .12s;
  border: none;
  background: transparent;
  width: 100%;
  text-align: left;
}
.sb-nav-item:hover { background: rgba(255,255,255,0.04); color: #fff; }
.sb-nav-item.active {
  background: rgba(15, 181, 168, 0.12);
  color: #fff;
  box-shadow: inset 2px 0 0 var(--accent);
}
.sb-nav-icon {
  width: 16px; height: 16px;
  display: grid; place-items: center;
  color: currentColor;
  opacity: 0.9;
  flex-shrink: 0;
}
.sb-nav-count {
  margin-left: auto;
  font-size: 11px;
  background: rgba(255,255,255,0.06);
  padding: 1px 7px;
  border-radius: 10px;
  color: var(--sidebar-text-dim);
  font-family: 'IBM Plex Mono', monospace;
}
.sb-nav-count.crit { background: rgba(220,38,38,0.18); color: #ff8989; }

.sb-foot {
  margin-top: auto;
  padding: 14px 20px;
  border-top: 1px solid var(--sidebar-border);
  font-size: 11px;
  color: var(--sidebar-text-dim);
  line-height: 1.5;
}
.sb-status {
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 6px;
  color: var(--sidebar-text);
}
.sb-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(15,181,168,0.18); }
.sb-refresh {
  margin-top: 8px;
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px;
  background: transparent;
  color: var(--sidebar-text);
  border: 1px solid var(--sidebar-border);
  padding: 5px 9px;
  border-radius: 6px;
  cursor: pointer;
  font-family: inherit;
}
.sb-refresh:hover { border-color: var(--navy-500); color: #fff; }

/* ── Content ───────────────────────────────────────────────────────── */
.main { padding: 0; min-width: 0; }
.topbar {
  height: 60px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  position: sticky;
  top: 0;
  z-index: 10;
}
.crumbs { display: flex; align-items: center; gap: 8px; color: var(--text-3); font-size: 13px; }
.crumbs strong { color: var(--text-1); font-weight: 600; }
.crumb-sep { opacity: 0.4; }
.topbar-actions { display: flex; align-items: center; gap: 8px; }
.search {
  width: 280px;
  height: 34px;
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 0 10px 0 32px;
  font: inherit;
  font-size: 13px;
  background: var(--surface-2) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='7'/><path d='m21 21-4.3-4.3'/></svg>") no-repeat 10px center;
  color: var(--text-1);
}
.search:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.icon-btn {
  width: 34px; height: 34px;
  border-radius: 7px;
  border: 1px solid var(--border);
  background: var(--surface);
  cursor: pointer;
  display: grid; place-items: center;
  color: var(--text-2);
}
.icon-btn:hover { background: var(--surface-2); color: var(--text-1); }
.avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, #2c3e6b, #1a2848);
  color: #fff;
  display: grid; place-items: center;
  font-size: 12px;
  font-weight: 600;
}

.page {
  padding: 28px 32px 60px;
  max-width: 1500px;
}
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
.page-title {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.018em;
  margin: 0;
  color: var(--text-1);
}
.page-sub { color: var(--text-3); font-size: 13.5px; margin-top: 4px; }
.page-actions { display: flex; gap: 8px; align-items: center; }

/* ── Buttons ───────────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 14px;
  border-radius: 7px;
  font: inherit; font-size: 13px; font-weight: 600;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-1);
  cursor: pointer;
  transition: background .12s, border-color .12s, color .12s;
}
.btn:hover { background: var(--surface-2); border-color: var(--border-strong); }
.btn-primary {
  background: var(--navy-800);
  border-color: var(--navy-800);
  color: #fff;
}
.btn-primary:hover { background: var(--navy-900); border-color: var(--navy-900); }
.btn-accent {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.btn-accent:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--text-2); }
.btn-ghost:hover { background: var(--surface-2); color: var(--text-1); }
.btn-sm { padding: 5px 9px; font-size: 12px; }

/* ── Cards ─────────────────────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
}
.card-head {
  padding: 16px 20px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.card-title { font-size: 14px; font-weight: 700; color: var(--text-1); margin: 0; letter-spacing: -0.005em; }
.card-sub { font-size: 12px; color: var(--text-3); margin-top: 2px; font-weight: 500; }
.card-body { padding: 20px; }
.card-foot { padding: 12px 20px; border-top: 1px solid var(--border); background: var(--surface-2); border-radius: 0 0 var(--radius-lg) var(--radius-lg); font-size: 12px; color: var(--text-3); }

/* ── KPIs ──────────────────────────────────────────────────────────── */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}
.kpi {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px 18px;
  position: relative;
  overflow: hidden;
}
.kpi-label {
  display: flex; align-items: center; gap: 7px;
  font-size: 11.5px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-3);
  font-weight: 600;
}
.kpi-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.kpi-value { font-size: 30px; font-weight: 700; letter-spacing: -0.025em; color: var(--text-1); margin-top: 6px; line-height: 1; }
.kpi-meta { font-size: 11.5px; color: var(--text-3); margin-top: 8px; display: flex; align-items: center; gap: 4px; }
.kpi-delta { font-weight: 600; }
.kpi-delta.up { color: var(--crit); }
.kpi-delta.down { color: var(--low); }
.kpi-delta.flat { color: var(--text-4); }

/* ── Risk score gauge (big number card) ────────────────────────────── */
.score-big {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 24px;
  align-items: center;
}
.score-ring {
  width: 132px; height: 132px;
  position: relative;
}
.score-ring svg { transform: rotate(-90deg); }
.score-ring-num {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  font-size: 34px;
  font-weight: 700;
  letter-spacing: -0.025em;
  color: var(--text-1);
}
.score-label { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.08em; }
.score-band { display: inline-flex; gap: 4px; margin-top: 6px; }
.score-band .seg { height: 6px; width: 28px; border-radius: 2px; background: var(--border); }
.score-band .seg.active.low { background: var(--low); }
.score-band .seg.active.med { background: var(--med); }
.score-band .seg.active.high { background: var(--high); }
.score-band .seg.active.crit { background: var(--crit); }

/* ── Badges ────────────────────────────────────────────────────────── */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.02em;
  white-space: nowrap;
  border: 1px solid transparent;
}
.badge.crit { background: var(--crit-soft); color: var(--crit); border-color: rgba(220,38,38,0.2); }
.badge.high { background: var(--high-soft); color: var(--high); border-color: rgba(234,88,12,0.2); }
.badge.med  { background: var(--med-soft);  color: var(--med);  border-color: rgba(37,99,235,0.2); }
.badge.low  { background: var(--low-soft);  color: var(--low);  border-color: rgba(22,163,74,0.2); }
.badge.unknown { background: var(--unknown-soft); color: var(--unknown); }
.badge.kev { background: var(--kev-soft); color: var(--kev); border-color: rgba(123,47,190,0.2); }
.badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.sm { padding: 1px 7px; font-size: 10.5px; }
.badge.solid { color: #fff; }
.badge.solid.crit { background: var(--crit); border-color: var(--crit); }
.badge.solid.high { background: var(--high); border-color: var(--high); }
.badge.solid.med  { background: var(--med);  border-color: var(--med); }
.badge.solid.low  { background: var(--low);  border-color: var(--low); }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  font-size: 12px;
  color: var(--text-2);
  font-weight: 500;
}
.chip.active { background: var(--accent-soft); color: var(--accent-dark); border-color: rgba(15,181,168,0.3); }

/* ── Tables / lists ────────────────────────────────────────────────── */
.list { display: flex; flex-direction: column; }
.list-row {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 14px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background .1s;
}
.list-row:last-child { border-bottom: 0; }
.list-row:hover { background: var(--surface-2); }
.list-rail {
  width: 3px; height: 36px; border-radius: 2px;
}
.list-rail.crit { background: var(--crit); }
.list-rail.high { background: var(--high); }
.list-rail.med  { background: var(--med); }
.list-rail.low  { background: var(--low); }
.list-title { font-weight: 600; color: var(--text-1); font-size: 13.5px; }
.list-meta { font-size: 12px; color: var(--text-3); margin-top: 3px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.list-score {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-1);
  background: var(--surface-2);
  border: 1px solid var(--border);
  padding: 3px 9px;
  border-radius: 6px;
}

/* ── Tables ────────────────────────────────────────────────────────── */
table.data {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
table.data th, table.data td {
  text-align: left;
  padding: 11px 14px;
  border-bottom: 1px solid var(--border);
}
table.data th {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-3);
  font-weight: 600;
  background: var(--surface-2);
}
table.data tr:last-child td { border-bottom: 0; }
table.data tr:hover td { background: var(--surface-2); }
table.data td .mono { font-size: 12.5px; }

/* ── Distribution bar ──────────────────────────────────────────────── */
.distbar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--border); }
.distbar > span { display: block; height: 100%; }
.dist-legend { display: flex; gap: 16px; margin-top: 10px; flex-wrap: wrap; }
.dist-legend > div { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-2); }
.dist-legend .sw { width: 9px; height: 9px; border-radius: 2px; }

/* ── Tabs ──────────────────────────────────────────────────────────── */
.tabs {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
}
.tab {
  padding: 10px 14px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-3);
  border: none;
  background: transparent;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  margin-bottom: -1px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.tab:hover { color: var(--text-1); }
.tab.active { color: var(--text-1); border-bottom-color: var(--accent); }
.tab-count {
  font-size: 11px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  padding: 1px 7px;
  border-radius: 10px;
  color: var(--text-3);
  font-family: 'IBM Plex Mono', monospace;
}
.tab.active .tab-count { background: var(--accent-soft); color: var(--accent-dark); border-color: transparent; }

/* ── Misc ──────────────────────────────────────────────────────────── */
.grid-2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.row { display: flex; align-items: center; gap: 10px; }
.row-gap { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

.divider { height: 1px; background: var(--border); margin: 16px 0; }

.alert {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 14px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  font-size: 13px;
  color: var(--text-2);
}
.alert-strong { color: var(--text-1); font-weight: 600; }
.alert.warn { background: #fff8eb; border-color: #f4d68a; color: #7a4f00; }
.alert.warn .alert-strong { color: #5a3a00; }
.alert.info { background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; }
.alert.info .alert-strong { color: #1e3a8a; }

.mitre-tag {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 8px;
  background: #f1efff;
  color: #5b3fc4;
  font-size: 11px;
  font-weight: 600;
  border-radius: 5px;
  border: 1px solid #e2dcf7;
}

.section-h {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-3);
  margin: 0 0 10px;
}

.status-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 600;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-2);
}
.status-pill .ind { width: 7px; height: 7px; border-radius: 50%; background: var(--text-4); }
.status-pill.open .ind { background: var(--crit); box-shadow: 0 0 0 3px rgba(220,38,38,0.16); }
.status-pill.ack .ind { background: var(--high); }
.status-pill.resolved .ind { background: var(--low); }
.status-pill.fp .ind { background: var(--text-4); }

/* ── Trend sparkline / bars ────────────────────────────────────────── */
.sparkbars { display: flex; align-items: flex-end; gap: 4px; height: 90px; }
.sparkbars .bar { flex: 1; background: var(--border); border-radius: 2px 2px 0 0; position: relative; }
.sparkbars .bar .seg { display: block; width: 100%; }
.sparkbars .bar .seg.crit { background: var(--crit); }
.sparkbars .bar .seg.high { background: var(--high); }
.sparkbars .bar .seg.med  { background: var(--med); }
.sparkbars .bar .seg.low  { background: var(--low); }
.sparkbars .bar .seg:first-child { border-radius: 2px 2px 0 0; }

.donut { position: relative; width: 200px; height: 200px; margin: 0 auto; }
.donut svg { transform: rotate(-90deg); }
.donut-center {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  text-align: center;
}
.donut-center .num { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }
.donut-center .lbl { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.08em; }

/* finding detail */
.detail-hero {
  background: linear-gradient(135deg, var(--navy-800) 0%, var(--navy-700) 100%);
  color: #fff;
  border-radius: 14px;

      "description": "### Summary\n\n\n\n`qs.stringify` throws `TypeError` when called with `arrayFormat: 'comma'` and `encodeValuesOnly: true` on an array containing `null` or `undefined`. The throw is synchronous and not handled by any of qs's null-related options (`skipNulls`, `strictNullHandling`).\n\n\n\n### Details\n\n\n\nIn the comma + `encodeValuesOnly` branch, `lib/stringify.js:145` mapped the array through the raw encoder before joining:\n\n\n\n```js\n\n\n\nobj = utils.maybeMap(obj, encoder);\n\n\n\n```\n\n\n\n`utils.encode` (`lib/utils.js:195`) reads `str.length` with no null guard, so a `null` or `undefined` element throws `TypeError`. `skipNulls` and `strictNullHandling` are both checked in the per-element loop below this line and never get a chance to run.\n\n\n\nSame class of bug as the filter-array path fixed in 0c180a4. The vulnerable shape of the comma + `encodeValuesOnly` branch was introduced in 4c4b23d (\"encode comma values more consistently\", PR #463, 2023-01-19), first released in v6.11.1.\n\n\n\n#### PoC\n\n\n\n```js\n\n\n\nconst qs = require('qs');\n\n\n\nqs.stringify({ a: [null, 'b'] },      { arrayFormat: 'comma', encodeValuesOnly: true });\n\n\n\nqs.stringify({ a: [undefined, 'b'] }, { arrayFormat: 'comma', encodeValuesOnly: true });\n\n\n\nqs.stringify({ a: [null] },           { arrayFormat: 'comma', encodeValuesOnly: true });\n\n\n\n// TypeError: Cannot read properties of null (reading 'length')\n\n\n\n//     at encode (lib/utils.js:195:13)\n\n\n\n//     at Object.maybeMap (lib/utils.js:322:37)\n\n\n\n//     at stringify (lib/stringify.js:145:25)\n\n\n\n```\n\n\n\n#### Fix\n\n\n\n`lib/stringify.js:145`, applied in 21f80b3 on `main` and released as v6.15.2:\n\n\n\n```diff\n\n\n\n- obj = utils.maybeMap(obj, encoder);\n\n\n\n+ obj = utils.maybeMap(obj, function (v) {\n\n\n\n+     return v == null ? v : encoder(v);\n\n\n\n+ });\n\n\n\n```\n\n\n\n`null` and `undefined` now pass through `maybeMap` unchanged and reach the `join(',')` step as-is. For `{ a: [null, 'b'] }` this produces `a=,b`, matching the non-`encodeValuesOnly` comma path (which already joins before encoding and produces `a=%2Cb` for the same input). Single-element `[null]` arrays still collapse via the existing `obj.join(',') || null` and remain subject to `skipNulls` / `strictNullHandling` in the main loop.\n\n\n\n### Affected versions\n\n\n\n`>=6.11.1 <6.15.2` \u2014 fixed in v6.15.2.\n\n\n\nThe vulnerable code shape was introduced in 4c4b23d and first shipped in v6.11.1. Earlier versions \u2014 including all of 6.7.x, 6.8.x, 6.9.x, 6.10.x, and 6.11.0 \u2014 implemented the comma + `encodeValuesOnly` path differently (joining before encoding) and are not affected. Empirically verified across released versions.\n\n\n\n### Impact\n\n\n\nApplication code that calls `qs.stringify` with both `arrayFormat: 'comma'` and `encodeValuesOnly: true` (both non-default) on input that may contain a `null` or `undefined` array element will throw synchronously instead of producing a query string. In a typical Node.js HTTP framework (Express, Fastify, Koa, hapi) the sync throw is caught by the framework's error boundary and the affected request returns a 500; the worker process does not exit and subsequent requests are unaffected. The \"kills the worker process\" framing applies only to call sites outside a request-handler error boundary (background jobs, startup paths, stream pipelines) or to deployments with framework error handling explicitly disabled.\n\n\n\nThe vulnerable input is a `null` or `undefined` entry inside an array; this is reachable from JSON request bodies or from application code constructing arrays from user input, but not from standard HTML form submissions (which produce strings or omitted fields, not literal `null`)."

// Donut for severity distribution
const SeverityDonut = ({ summary }) => {
  const segs = [
    { key: "critical", value: summary.critical, color: "var(--crit)", label: "Critical" },
    { key: "high",     value: summary.high,     color: "var(--high)", label: "High" },
    { key: "medium",   value: summary.medium,   color: "var(--med)",  label: "Medium" },
    { key: "low",      value: summary.low,      color: "var(--low)",  label: "Low" },
  ];
  const total = segs.reduce((s, d) => s + d.value, 0) || 1;
  const size = 200, stroke = 22;
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  let offset = 0;
  return (
    <div className="donut" style={{ width: size, height: size }}>
      <svg width={size} height={size}>
        <circle cx={size/2} cy={size/2} r={r} stroke="#eef0f4" strokeWidth={stroke} fill="none" />
        {segs.map((s, i) => {
          if (!s.value) return null;
          const len = (s.value / total) * c;
          const el = (
            <circle key={i} cx={size/2} cy={size/2} r={r}
              stroke={resolveCSSVar(s.color)} strokeWidth={stroke} fill="none"
              strokeDasharray={`${len} ${c - len}`}
              strokeDashoffset={-offset}
            />
          );
          offset += len;
          return el;
        })}
      </svg>
      <div className="donut-center">

function resolveCSSVar(v) {
  if (typeof v !== "string" || !v.startsWith("var(")) return v;
  const name = v.slice(4, -1).trim();
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || "#888";
}

// ── Stacked area trend ───────────────────────────────────────────────
const TrendBars = ({ trend }) => {
  const max = Math.max(...trend.map(t => t.crit + t.high + t.med + t.low));
  return (
    <div>
      <div className="sparkbars">
        {trend.map((t, i) => {
          const total = t.crit + t.high + t.med + t.low;
          const h = (total / max) * 100;
          return (
            <div className="bar" key={i} style={{ height: "100%", background: "transparent" }} title={`${t.d} · C${t.crit} H${t.high} M${t.med} L${t.low}`}>
              <div style={{ height: `${100 - h}%` }} />
              <span className="seg crit" style={{ height: `${(t.crit/max)*100}%` }} />
              <span className="seg high" style={{ height: `${(t.high/max)*100}%` }} />
              <span className="seg med"  style={{ height: `${(t.med/max)*100}%` }} />
              <span className="seg low"  style={{ height: `${(t.low/max)*100}%` }} />

function parseRec(text) {
  if (!text) return [];
  text = text.trim();
  if (/\d+\.\s+/.test(text)) {
    return text.split(/\s*\d+\.\s+/).filter(Boolean).map(s => s.trim().replace(/\.$/, ""));
  }
  return text.split(". ").filter(Boolean).map(s => s.trim().replace(/\.$/, ""));
}

              )}

          );
        })}
      </div>
    </div>
  );
};

// ── color helpers ────────────────────────────────────────────────────
function hexToRgb(h) {
  h = h.replace("#", "");
  if (h.length === 3) h = h.split("").map(c => c+c).join("");
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function rgbToHex(r,g,b) {
  return "#" + [r,g,b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2,"0")).join("");
}
function shade(hex, pct) {
  const [r,g,b] = hexToRgb(hex);
  const f = pct < 0 ? 1 + pct : 1;
  const t = pct < 0 ? 0 : 255 * pct;
  return rgbToHex(r*f + t, g*f + t, b*f + t);
}
function tint(hex, pct) {
  // mix with white by pct (0..1)
  const [r,g,b] = hexToRgb(hex);
  return rgbToHex(r + (255-r)*pct, g + (255-g)*pct, b + (255-b)*pct);
}
